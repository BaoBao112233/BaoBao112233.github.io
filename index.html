<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot của Bảo Bảo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    #chatbox { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; }
    .msg { margin: 5px 0; }
    .user { color: blue; }
    .bot { color: green; }
    input { width: 80%; padding: 10px; }
    button { padding: 10px; }
  </style>
</head>
<body>
  <h1>🤖 Chatbot của Bảo Bảo</h1>
  <div id="chatbox"></div>
  <input id="userInput" type="text" placeholder="Nhập tin nhắn...">
  <button onclick="sendMessage()">Gửi</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const chatbox = document.getElementById("chatbox");
      const msg = input.value.trim();
      if (!msg) return;

      chatbox.innerHTML += `<div class="msg user"><b>Bạn:</b> ${msg}</div>`;
      input.value = "";

      // ⚠️ Thay URL API bằng backend thật của bạn
      const response = await fetch("https://chat-with-pdf-baobao.onrender.com/ai/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
            session_id: 0, // Thêm session_id nếu cần
            user_id: 0, // Thêm user_id nếu cần
            message: msg })
      });

      const data = await response.json();
        // Sửa lỗi Bot trả về undefined
        let botReply = data.response;
        if (!botReply) {
          // Nếu không có trường reply, thử lấy trường answer hoặc hiển thị lỗi
          botReply = data.answer || "(Lỗi: API không trả về phản hồi hợp lệ)";
        }
        chatbox.innerHTML += `<div class="msg bot"><b>Bot:</b> ${botReply}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
</body>
</html>
